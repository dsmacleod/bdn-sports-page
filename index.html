<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maine High School Sports — Bangor Daily News</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Matches bangordailynews.com's own computed styles (checked live:
    // Sep 2026) since this page lives at bangordailynews.com/maine-sports —
    // green #0f5e34 (nav bar / category eyebrow labels), Open Sans for
    // everything including headlines (no separate display face), body text
    // #111111 on white. No more Oswald/approximated green.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bdn: { green: '#0f5e34', gold: '#f1bc38', gray: '#111111' },
          },
          fontFamily: {
            heading: ['Open Sans', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white font-body text-bdn-gray">
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
